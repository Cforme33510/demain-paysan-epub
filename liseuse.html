<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liseuse</title>

<!-- ═══════════════════════════════════════════════════════════════
     epub.js + JSZip (nécessaire pour lire les fichiers .epub)
     ═══════════════════════════════════════════════════════════════ -->
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js"></script>

<style>
  :root {
    --paper:  #FBFAF7;   /* fond de lecture, papier légèrement froid */
    --ink:    #1E2A25;   /* texte / éléments principaux */
    --ink-soft: #5C6B63; /* texte secondaire */
    --line:   #E4E1D8;   /* filets, séparateurs */
    --accent: #3C6E5F;   /* vert profond, accent unique */
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--paper);
    color: var(--ink);
    font-family: system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* Cadre global de la liseuse */
  .reader {
    display: flex;
    flex-direction: column;
    height: 100vh;
    max-width: 1100px;
    margin: 0 auto;
    position: relative;
  }

  /* ── Zone de lecture ───────────────────────────────────── */
  .stage {
    position: relative;
    flex: 1;
    min-height: 0;
    display: flex;
  }

  #viewer {
    flex: 1;
    min-width: 0;
    position: relative;
  }

  /* Séparateur central, visible uniquement en mode double page */
  @media (min-width: 800px) {
    #viewer::after {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 1px;
      background: var(--line);
      z-index: 3;
      pointer-events: none;
    }
  }

  /* Flèches de navigation latérales */
  .arrow {
    position: absolute;
    top: 0; bottom: 0;
    width: 64px;
    border: none;
    background: transparent;
    cursor: pointer;
    color: var(--ink-soft);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 4;
    transition: color .15s ease, background .15s ease;
  }
  .arrow:hover { color: var(--ink); background: rgba(60,110,95,0.06); }
  .arrow:focus-visible { outline: 2px solid var(--accent); outline-offset: -4px; }
  .arrow.prev { left: 0; }
  .arrow.next { right: 0; }
  .arrow svg { width: 22px; height: 22px; }

  /* ── États de chargement / erreur ──────────────────────── */
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: var(--paper);
    z-index: 8;
    text-align: center;
    padding: 24px;
  }
  .overlay.hidden { display: none; }
  .spinner {
    width: 26px; height: 26px;
    border: 2.5px solid var(--line);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  .overlay p { color: var(--ink-soft); font-size: 14px; margin: 0; max-width: 34ch; line-height: 1.5; }
  .overlay .em { color: var(--ink); font-size: 16px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation-duration: .001ms !important; }
  }

  @media (max-width: 640px) {
    .arrow { width: 44px; }
  }
</style>
</head>
<body>

<div class="reader">

  <!-- Scène de lecture -->
  <div class="stage">
    <button class="arrow prev" id="prev" aria-label="Page précédente">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>

    <div id="viewer"></div>

    <button class="arrow next" id="next" aria-label="Page suivante">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </button>

    <!-- Chargement -->
    <div class="overlay" id="loading">
      <div class="spinner"></div>
      <p><span class="em">Ouverture du livre…</span></p>
    </div>
  </div>


</div>

<script>
/* ═══════════════════════════════════════════════════════════════
   ⚙️  Adresse de votre fichier .epub
   ═══════════════════════════════════════════════════════════════ */
const EPUB_URL = "DEMAIN_PAYSAN_EXTRACT.epub";


/* ── Le reste fonctionne tout seul ───────────────────────────── */
(function () {
  const loading   = document.getElementById('loading');

  if (typeof ePub === 'undefined') {
    showError("Impossible de charger le moteur de lecture.",
              "Vérifiez votre connexion, puis rechargez la page.");
    return;
  }

  let book, rendition;
  try {
    book = ePub(EPUB_URL);
    rendition = book.renderTo("viewer", {
      width: "100%",
      height: "100%",
      spread: "auto",
      minSpreadWidth: 800,
      flow: "paginated",
      allowScriptedContent: true
    });
  } catch (e) {
    showError("Le fichier n'a pas pu être ouvert.", errorHint());
    return;
  }

  // Thème de lecture appliqué à l'intérieur du livre
  rendition.themes.default({
    "body": {
      "font-family": "Georgia, 'Iowan Old Style', serif !important",
      "line-height": "1.6 !important",
      "color": "#1E2A25 !important",
      "padding": "0 8px !important"
    },
    "p": { "margin": "0 0 1em 0 !important" },
    "a": { "color": "#3C6E5F !important" },
    "::selection": { "background": "#EAF0ED" }
  });

  rendition.display().then(function () {
    loading.classList.add('hidden');
  }).catch(function () {
    showError("Le livre n'a pas pu s'afficher.", errorHint());
  });

  /* ── Empêche TOUT focus programmatique de faire défiler la page
     hôte (FORMAT) : neutralise window.focus() et force
     preventScroll sur tout element.focus() dans cette page ─────── */
  (function () {
    window.focus = function () {};
    const nativeFocus = HTMLElement.prototype.focus;
    HTMLElement.prototype.focus = function (opts) {
      return nativeFocus.call(this, Object.assign({}, opts, { preventScroll: true }));
    };
  })();

  /* ── Empêche epub.js de forcer le focus sur ses iframes internes,
     seconde barrière pour les iframes créées dynamiquement ───────── */
  (function () {
    const target = document.getElementById('viewer');
    function neutralize(frame) {
      try {
        if (frame && frame.contentWindow) {
          frame.contentWindow.focus = function () {};
        }
      } catch (e) {}
    }
    const mo = new MutationObserver(function (mutations) {
      mutations.forEach(function (m) {
        m.addedNodes.forEach(function (node) {
          if (node.tagName === 'IFRAME') {
            neutralize(node);
            node.addEventListener('load', function () { neutralize(node); });
          }
        });
      });
    });
    mo.observe(target, { childList: true, subtree: true });
  })();

  /* ── Navigation ─────────────────────────────────────────── */
  const prev = () => rendition.prev();
  const next = () => rendition.next();

  document.getElementById('prev').addEventListener('click', prev);
  document.getElementById('next').addEventListener('click', next);

  document.addEventListener('keyup', function (e) {
    if (e.key === 'ArrowLeft') prev();
    if (e.key === 'ArrowRight') next();
  });
  rendition.on('keyup', function (e) {
    if (e.key === 'ArrowLeft') prev();
    if (e.key === 'ArrowRight') next();
  });

  /* ── Gestion d'erreur ───────────────────────────────────── */
  function errorHint() {
    return "Vérifiez que l'adresse du fichier .epub est correcte, " +
           "que le fichier est bien accessible en ligne, et que le serveur " +
           "autorise le chargement (CORS).";
  }
  function showError(main, hint) {
    loading.classList.remove('hidden');
    loading.innerHTML =
      '<p><span class="em">' + main + '</span></p>' +
      '<p>' + hint + '</p>';
  }
})();
</script>
</body>
</html>
