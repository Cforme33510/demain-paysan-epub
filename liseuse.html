<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liseuse</title>

<!-- ═══════════════════════════════════════════════════════════════
     epub.js + JSZip (nécessaire pour lire les fichiers .epub)
     ═══════════════════════════════════════════════════════════════ -->
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js"></script>

<!-- Typographie de l'interface -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500&display=swap" rel="stylesheet">

<style>
  /* ─────────────────────────────────────────────────────────
     ⚙️  RÉGLAGE — remplacez l'adresse ci-dessous (dans le <script>
         plus bas) par celle de VOTRE fichier .epub sur GitHub Pages.
     ───────────────────────────────────────────────────────── */

  :root {
    --paper:      #FBFAF7;   /* fond de lecture, papier légèrement froid */
    --ink:        #1E2A25;   /* texte / éléments principaux */
    --ink-soft:   #5C6B63;   /* texte secondaire, labels */
    --line:       #E4E1D8;   /* filets, séparateurs */
    --accent:     #3C6E5F;   /* vert profond, accent unique */
    --accent-dim: #EAF0ED;   /* fond d'accent discret */
    --shadow:     0 1px 2px rgba(30,42,37,.06), 0 8px 30px rgba(30,42,37,.06);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* Cadre global de la liseuse */
  .reader {
    display: flex;
    flex-direction: column;
    height: 100vh;
    max-width: 1100px;
    margin: 0 auto;
    position: relative;
  }

  /* ── Barre du haut ─────────────────────────────────────── */
  .bar {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 20px;
    border-bottom: 1px solid var(--line);
    background: var(--paper);
    z-index: 5;
  }

  .title {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 500;
    font-size: 17px;
    letter-spacing: -0.01em;
    margin-right: auto;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .title span { color: var(--ink-soft); font-weight: 400; }

  /* Boutons d'interface */
  .btn {
    appearance: none;
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--ink);
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    height: 34px;
    padding: 0 12px;
    border-radius: 8px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: background .15s ease, border-color .15s ease;
  }
  .btn:hover { background: var(--accent-dim); border-color: #CFD8D3; }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn.icon { padding: 0; width: 34px; justify-content: center; }
  .btn svg { width: 16px; height: 16px; display: block; }

  .type-controls { display: flex; gap: 4px; }

  /* ── Zone de lecture ───────────────────────────────────── */
  .stage {
    position: relative;
    flex: 1;
    min-height: 0;
    display: flex;
  }

  #viewer {
    flex: 1;
    min-width: 0;
  }

  /* Flèches de navigation latérales */
  .arrow {
    position: absolute;
    top: 0; bottom: 0;
    width: 64px;
    border: none;
    background: transparent;
    cursor: pointer;
    color: var(--ink-soft);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 4;
    transition: color .15s ease, background .15s ease;
  }
  .arrow:hover { color: var(--ink); background: linear-gradient(var(--accent-dim), var(--accent-dim)); }
  .arrow:focus-visible { outline: 2px solid var(--accent); outline-offset: -4px; }
  .arrow.prev { left: 0; }
  .arrow.next { right: 0; }
  .arrow svg { width: 22px; height: 22px; }

  /* ── Barre du bas : progression + sommaire ─────────────── */
  .foot {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 12px 20px;
    border-top: 1px solid var(--line);
    background: var(--paper);
    z-index: 5;
  }

  .progress {
    flex: 1;
    height: 3px;
    background: var(--line);
    border-radius: 3px;
    overflow: hidden;
  }
  .progress > i {
    display: block;
    height: 100%;
    width: 0%;
    background: var(--accent);
    transition: width .3s ease;
  }

  .pct {
    font-size: 12px;
    color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
    min-width: 38px;
    text-align: right;
  }

  /* ── Panneau Sommaire (table des matières) ─────────────── */
  .toc {
    position: absolute;
    top: 0; bottom: 0; left: 0;
    width: min(320px, 82%);
    background: var(--paper);
    border-right: 1px solid var(--line);
    box-shadow: var(--shadow);
    transform: translateX(-102%);
    transition: transform .28s cubic-bezier(.4,0,.2,1);
    z-index: 10;
    display: flex;
    flex-direction: column;
  }
  .toc.open { transform: translateX(0); }
  .toc-head {
    padding: 16px 20px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .toc-head h2 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 15px;
    margin: 0;
    text-transform: none;
    letter-spacing: 0.04em;
    color: var(--ink-soft);
  }
  .toc-list { overflow-y: auto; padding: 8px 0; }
  .toc-list a {
    display: block;
    padding: 9px 20px;
    color: var(--ink);
    text-decoration: none;
    font-size: 14px;
    line-height: 1.35;
    border-left: 3px solid transparent;
    transition: background .12s ease, border-color .12s ease;
  }
  .toc-list a:hover { background: var(--accent-dim); }
  .toc-list a.current { border-left-color: var(--accent); background: var(--accent-dim); color: var(--accent); }

  .backdrop {
    position: absolute;
    inset: 0;
    background: rgba(30,42,37,.28);
    opacity: 0;
    pointer-events: none;
    transition: opacity .28s ease;
    z-index: 9;
  }
  .backdrop.show { opacity: 1; pointer-events: auto; }

  /* ── États de chargement / erreur ──────────────────────── */
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: var(--paper);
    z-index: 8;
    text-align: center;
    padding: 24px;
  }
  .overlay.hidden { display: none; }
  .spinner {
    width: 28px; height: 28px;
    border: 2.5px solid var(--line);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  .overlay p { color: var(--ink-soft); font-size: 14px; margin: 0; max-width: 34ch; line-height: 1.5; }
  .overlay .em { font-family: 'Fraunces', serif; color: var(--ink); font-size: 16px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Accessibilité : mouvement réduit */
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation-duration: .001ms !important; }
  }

  /* Mobile */
  @media (max-width: 640px) {
    .bar { padding: 12px 14px; gap: 10px; }
    .foot { padding: 10px 14px; }
    .arrow { width: 44px; }
    .title { font-size: 15px; }
    .type-controls .label-hide { display: none; }
  }
</style>
</head>
<body>

<div class="reader">

  <!-- Barre supérieure -->
  <header class="bar">
    <button class="btn icon" id="tocBtn" aria-label="Ouvrir le sommaire" title="Sommaire">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <path d="M4 6h16M4 12h16M4 18h10"/>
      </svg>
    </button>
    <div class="title" id="bookTitle">Chargement…</div>
    <div class="type-controls">
      <button class="btn icon" id="fontDown" aria-label="Réduire le texte" title="Réduire le texte">A−</button>
      <button class="btn icon" id="fontUp" aria-label="Agrandir le texte" title="Agrandir le texte">A+</button>
    </div>
  </header>

  <!-- Scène de lecture -->
  <div class="stage">
    <button class="arrow prev" id="prev" aria-label="Page précédente">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>

    <div id="viewer"></div>

    <button class="arrow next" id="next" aria-label="Page suivante">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </button>

    <!-- Sommaire -->
    <nav class="toc" id="toc" aria-label="Sommaire">
      <div class="toc-head">
        <h2>SOMMAIRE</h2>
        <button class="btn icon" id="tocClose" aria-label="Fermer le sommaire">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="toc-list" id="tocList"></div>
    </nav>
    <div class="backdrop" id="backdrop"></div>

    <!-- Chargement -->
    <div class="overlay" id="loading">
      <div class="spinner"></div>
      <p><span class="em">Ouverture du livre…</span></p>
    </div>
  </div>

  <!-- Barre inférieure -->
  <footer class="foot">
    <div class="progress"><i id="progressBar"></i></div>
    <div class="pct" id="pct">0 %</div>
  </footer>

</div>

<script>
/* ═══════════════════════════════════════════════════════════════
   ⚙️  À MODIFIER — l'adresse de votre fichier .epub
   ───────────────────────────────────────────────────────────────
   Une fois votre .epub déposé sur GitHub Pages, mettez son adresse
   complète ici. Exemple :
   const EPUB_URL = "https://monpseudo.github.io/mon-depot/mon-livre.epub";

   Si le fichier .epub est à côté de ce fichier HTML dans le même
   dépôt, une adresse relative suffit : "mon-livre.epub"
   ═══════════════════════════════════════════════════════════════ */
const EPUB_URL = "mon-livre.epub";


/* ── Le reste fonctionne tout seul ───────────────────────────── */
(function () {
  const loading   = document.getElementById('loading');
  const viewer    = document.getElementById('viewer');
  const titleEl   = document.getElementById('bookTitle');
  const tocList   = document.getElementById('tocList');
  const toc       = document.getElementById('toc');
  const backdrop  = document.getElementById('backdrop');
  const progressBar = document.getElementById('progressBar');
  const pctEl     = document.getElementById('pct');

  let fontScale = 100;

  // Vérifie que epub.js a bien chargé
  if (typeof ePub === 'undefined') {
    showError("Impossible de charger le moteur de lecture.",
              "Vérifiez votre connexion, puis rechargez la page.");
    return;
  }

  let book, rendition;
  try {
    book = ePub(EPUB_URL);
    rendition = book.renderTo("viewer", {
      width: "100%",
      height: "100%",
      spread: "none",       // une seule page à la fois (idéal en iframe)
      flow: "paginated",
      allowScriptedContent: true
    });
  } catch (e) {
    showError("Le fichier n'a pas pu être ouvert.", errorHint());
    return;
  }

  // Thème de lecture appliqué à l'intérieur du livre
  rendition.themes.default({
    "body": {
      "font-family": "Georgia, 'Iowan Old Style', serif !important",
      "line-height": "1.6 !important",
      "color": "#1E2A25 !important",
      "padding": "0 8px !important"
    },
    "p": { "margin": "0 0 1em 0 !important" },
    "a": { "color": "#3C6E5F !important" },
    "::selection": { "background": "#EAF0ED" }
  });
  rendition.themes.fontSize(fontScale + "%");

  // Affichage initial
  rendition.display().then(function () {
    loading.classList.add('hidden');
  }).catch(function () {
    showError("Le livre n'a pas pu s'afficher.", errorHint());
  });

  // Titre + sommaire une fois les métadonnées prêtes
  book.loaded.metadata.then(function (meta) {
    if (meta && meta.title) {
      titleEl.innerHTML = meta.title + (meta.creator ? ' <span>· ' + meta.creator + '</span>' : '');
      document.title = meta.title;
    } else {
      titleEl.textContent = 'Ma liseuse';
    }
  });

  book.loaded.navigation.then(function (nav) {
    const build = function (items) {
      items.forEach(function (item) {
        const a = document.createElement('a');
        a.textContent = item.label.trim();
        a.href = item.href;
        a.dataset.href = item.href;
        a.addEventListener('click', function (e) {
          e.preventDefault();
          rendition.display(item.href);
          closeToc();
        });
        tocList.appendChild(a);
        if (item.subitems && item.subitems.length) build(item.subitems);
      });
    };
    if (nav.toc && nav.toc.length) build(nav.toc);
    else tocList.innerHTML = '<a style="cursor:default;color:var(--ink-soft)">Aucun sommaire dans ce livre.</a>';
  });

  // Progression de lecture
  book.ready.then(function () {
    return book.locations.generate(1200);
  }).then(function () {
    rendition.on('relocated', function (location) {
      const pct = Math.round(book.locations.percentageFromCfi(location.start.cfi) * 100);
      progressBar.style.width = pct + '%';
      pctEl.textContent = pct + ' %';
      highlightToc(location.start.href);
    });
  });

  function highlightToc(href) {
    tocList.querySelectorAll('a').forEach(function (a) {
      const match = a.dataset.href && href && href.indexOf(a.dataset.href.split('#')[0]) !== -1;
      a.classList.toggle('current', !!match);
    });
  }

  /* ── Navigation ─────────────────────────────────────────── */
  const prev = () => rendition.prev();
  const next = () => rendition.next();

  document.getElementById('prev').addEventListener('click', prev);
  document.getElementById('next').addEventListener('click', next);

  document.addEventListener('keyup', function (e) {
    if (e.key === 'ArrowLeft') prev();
    if (e.key === 'ArrowRight') next();
    if (e.key === 'Escape') closeToc();
  });
  // Flèches clavier aussi quand le focus est dans le livre (iframe interne)
  rendition.on('keyup', function (e) {
    if (e.key === 'ArrowLeft') prev();
    if (e.key === 'ArrowRight') next();
  });

  /* ── Taille du texte ────────────────────────────────────── */
  document.getElementById('fontUp').addEventListener('click', function () {
    fontScale = Math.min(fontScale + 10, 160);
    rendition.themes.fontSize(fontScale + '%');
  });
  document.getElementById('fontDown').addEventListener('click', function () {
    fontScale = Math.max(fontScale - 10, 70);
    rendition.themes.fontSize(fontScale + '%');
  });

  /* ── Sommaire ───────────────────────────────────────────── */
  function openToc()  { toc.classList.add('open'); backdrop.classList.add('show'); }
  function closeToc() { toc.classList.remove('open'); backdrop.classList.remove('show'); }
  document.getElementById('tocBtn').addEventListener('click', openToc);
  document.getElementById('tocClose').addEventListener('click', closeToc);
  backdrop.addEventListener('click', closeToc);

  /* ── Gestion d'erreur ───────────────────────────────────── */
  function errorHint() {
    return "Vérifiez que l'adresse du fichier .epub est correcte, " +
           "que le fichier est bien accessible en ligne, et que le serveur " +
           "autorise le chargement (CORS).";
  }
  function showError(main, hint) {
    loading.classList.remove('hidden');
    loading.innerHTML =
      '<p><span class="em">' + main + '</span></p>' +
      '<p>' + hint + '</p>';
  }
})();
</script>
</body>
</html>
